services:
  - type: web
    name: auroracart-dashboard
    runtime: python
    plan: free
    branch: main
    # Installs the `auroracart` package from src/ along with its pinned deps.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
